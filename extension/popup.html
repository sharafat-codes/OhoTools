<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>OhoTool</title>
  </head>
  <body>
    <header class="hd">
      <img src="icons/icon128.png" alt="" class="logo" />
      <span class="brand">OhoTool</span>
      <a class="hd-link" href="https://ohotool.com" target="_blank" rel="noopener">Open site ↗</a>
    </header>

    <div class="search">
      <input id="q" type="search" placeholder="Search tools…" autocomplete="off" autofocus />
    </div>

    <div id="list" class="list" role="listbox" aria-label="Tools"></div>

    <footer class="ft">
      <a href="https://ohotool.com/tools" target="_blank" rel="noopener">All tools</a>
      <a href="https://ohotool.com/request-tool" target="_blank" rel="noopener">Request a tool</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
